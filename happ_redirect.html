<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подключение Happ VPN</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            background: #ffffff;
            margin: 0;
        }
        h2 {
            margin-top: 10px;
            margin-bottom: 5px;
        }
        button {
            display: inline-block;
            margin: 10px 0;
            padding: 14px 24px;
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
        }
        .store-buttons {
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .store-buttons p {
            margin-bottom: 10px;
            color: #333;
            font-weight: bold;
        }
        .store-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .store-icon {
            display: inline-block;
            transition: transform 0.2s;
        }
        .store-icon img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .store-icon:hover {
            transform: scale(1.1);
        }
        .store-label {
            font-size: 12px;
            color: #555;
            margin-top: 4px;
        }
        .fallback {
            margin-top: 25px;
            color: #555;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 10px;
        }
        code {
            background: #eee;
            padding: 4px 8px;
            border-radius: 6px;
            word-break: break-all;
            font-size: 14px;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <h2>🚀 Автонастройка Happ</h2>
    <p>Нажмите кнопку ниже, чтобы открыть приложение Happ и импортировать подписку.</p>
    <button id="openBtn" onclick="openHapp()">Открыть Happ</button>
    <div class="status" id="status"></div>

    <!-- Блок со ссылками на скачивание -->
    <div class="store-buttons">
        <p>📱 Ещё нет приложения? Скачайте под ваше устройство:</p>
        <div class="store-icons">
            <div>
                <a class="store-icon" href="https://apps.apple.com/ru/app/happ-proxy-utility-plus/id6746188973" target="_blank" rel="noopener">
                    <img src="https://img.icons8.com/color/48/mac-os.png" alt="iOS">
                </a>
                <div class="store-label">iOS</div>
            </div>
            <div>
                <a class="store-icon" href="https://play.google.com/store/apps/details?id=com.happproxy" target="_blank" rel="noopener">
                    <img src="https://img.icons8.com/color/48/android-os.png" alt="Android">
                </a>
                <div class="store-label">Android</div>
            </div>
            <div>
                <a class="store-icon" href="https://github.com/Happ-proxy/happ-desktop/releases/latest/download/setup-Happ.x64.exe" target="_blank" rel="noopener">
                    <img src="https://img.icons8.com/color/48/windows-10.png" alt="Windows">
                </a>
                <div class="store-label">Windows</div>
            </div>
        </div>
    </div>

    <!-- Ручное копирование -->
    <div class="fallback">
        <p>Не открылось? Скопируйте ссылку и вставьте в Happ вручную:</p>
        <code id="link"></code>
        <br><br>
        <button onclick="copyLink()">Скопировать ссылку</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const link = params.get('link');
        document.getElementById('link').textContent = link || 'Ссылка не указана';

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function openHapp() {
            if (!link) {
                alert('Ошибка: ссылка не найдена');
                return;
            }
            try {
                tg.openLink(link, { try_instant_view: false });
                document.getElementById('status').innerText = '⏳ Открываем Happ…';
            } catch (e) {
                const newWindow = window.open(link, '_blank');
                if (!newWindow) {
                    document.getElementById('status').innerText = 'Не удалось открыть автоматически. Скопируйте ссылку вручную.';
                } else {
                    document.getElementById('status').innerText = 'Приложение должно открыться в новом окне.';
                }
            }
        }

        function copyLink() {
            if (!link) return;
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ Ссылка скопирована! Вставьте её в Happ (Добавить профиль → Импорт).');
            }).catch(() => {
                prompt('Скопируйте ссылку вручную:', link);
            });
        }

        window.addEventListener('load', function() {
            if (link) {
                setTimeout(() => {
                    try {
                        tg.openLink(link, { try_instant_view: false });
                    } catch (e) {}
                }, 600);
            }
        });
    </script>
</body>
</html>
