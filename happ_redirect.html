<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подключение Happ VPN</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            background: #ffffff;
        }
        button {
            display: inline-block;
            margin: 10px;
            padding: 14px 24px;
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
        }
        .fallback {
            margin-top: 20px;
            color: #555;
        }
        code {
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 6px;
            word-break: break-all;
            font-size: 14px;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>🚀 Автонастройка Happ</h2>
    <p>Нажмите кнопку ниже, чтобы открыть приложение Happ и импортировать подписку.</p>
    <button id="openBtn" onclick="openHapp()">Открыть Happ</button>
    <div class="status" id="status"></div>

    <div class="fallback">
        <p>Не открылось? Скопируйте ссылку и вставьте в Happ вручную:</p>
        <code id="link"></code>
        <br><br>
        <button onclick="copyLink()">Скопировать ссылку</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Получаем ссылку из параметра ?link=...
        const params = new URLSearchParams(window.location.search);
        const link = params.get('link');
        document.getElementById('link').textContent = link || 'Ссылка не указана';

        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // раскрываем на весь экран

        // Пытаемся автоматически открыть ссылку при загрузке, но с осторожностью
        window.addEventListener('load', function() {
            if (!link) return;
            // Пробуем через Telegram API (сработает, если не блокируется)
            try {
                tg.openLink(link, { try_instant_view: false });
                // Если не сработало, пользователь всё равно увидит кнопку
            } catch (e) {
                console.log('auto openLink failed:', e);
                // fallback не делаем, потому что кнопка всё равно есть
            }
        });

        function openHapp() {
            if (!link) {
                alert('Ошибка: ссылка не найдена');
                return;
            }
            // Основной метод через Telegram API
            try {
                tg.openLink(link, { try_instant_view: false });
                document.getElementById('status').innerText = 'Попытка открыть Happ...';
            } catch (e) {
                console.log('tg.openLink failed, trying window.open');
                // Если API недоступен, пробуем обычный window.open
                const newWindow = window.open(link, '_blank');
                if (!newWindow) {
                    document.getElementById('status').innerText = 'Не удалось открыть автоматически. Скопируйте ссылку вручную.';
                } else {
                    document.getElementById('status').innerText = 'Приложение должно открыться в новом окне.';
                }
            }
        }

        function copyLink() {
            if (!link) return;
            navigator.clipboard.writeText(link).then(() => {
                alert('Ссылка скопирована! Вставьте её в Happ (Добавить профиль → Импорт).');
            }).catch(() => {
                prompt('Скопируйте ссылку вручную:', link);
            });
        }
    </script>
</body>
</html>
