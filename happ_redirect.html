<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подключение Happ VPN</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
        }
        button {
            display: inline-block;
            margin: 10px;
            padding: 14px 24px;
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
        }
        .fallback {
            margin-top: 20px;
            color: #555;
        }
        code {
            background: #eee;
            padding: 4px 8px;
            border-radius: 6px;
            word-break: break-all;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>🚀 Автонастройка Happ</h2>
    <p>Нажмите кнопку ниже, чтобы открыть приложение Happ и импортировать подписку.</p>
    <button onclick="openHapp()">Открыть Happ</button>

    <div class="fallback">
        <p>Не открылось? Скопируйте ссылку и вставьте в Happ вручную:</p>
        <code id="link"></code>
        <br><br>
        <button onclick="copyLink()">Скопировать ссылку</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Получаем ссылку из параметра ?link=...
        const params = new URLSearchParams(window.location.search);
        const link = params.get('link');
        document.getElementById('link').textContent = link || 'Ссылка не указана';

        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();

        function openHapp() {
            if (!link) return;
            // Используем официальный метод Telegram для открытия ссылок
            tg.openLink(link, { try_instant_view: false });
        }

        function copyLink() {
            if (!link) return;
            navigator.clipboard.writeText(link).then(() => {
                alert('Ссылка скопирована! Вставьте её в Happ (Добавить профиль → Импорт).');
            }).catch(() => {
                prompt('Скопируйте ссылку вручную:', link);
            });
        }

        // Автоматически попытаться открыть при загрузке страницы (с задержкой)
        window.addEventListener('load', function() {
            if (link) {
                setTimeout(() => {
                    // Пытаемся открыть через Telegram API, если не получится – покажем кнопку
                    tg.openLink(link, { try_instant_view: false });
                }, 500);
            }
        });
    </script>
</body>
</html>
