<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnyxProxy · Подключение</title>
    <style>
        :root {
            --magenta: #d81b60;
            --magenta-light: #f06292;
            --magenta-dark: #ad1457;
            --bg-dark: #0f0f1a;
            --card-glass: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-secondary: #b0b0c0;
            --glow: 0 0 20px rgba(216, 27, 96, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1a1a35 0%, #0f0f1a 60%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 16px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Стеклянная карточка */
        .glass {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), var(--glow);
        }

        .brand-title {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--magenta-light) 0%, var(--magenta) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 8px;
        }

        .illustration {
            width: 100%;
            max-width: 240px;
            height: auto;
            margin: 0 auto 20px;
            display: block;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--magenta) 0%, var(--magenta-dark) 100%);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(216, 27, 96, 0.4);
            transition: transform 0.1s ease, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 4px 16px rgba(216, 27, 96, 0.6);
        }

        .status {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        .stores-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 6px;
        }

        .store-grid {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        .store-card {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px 8px;
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .store-card:active {
            transform: scale(0.96);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }

        .store-card img {
            width: 36px;
            height: 36px;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
        }

        .store-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .spoiler-glass {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
        }

        details summary {
            color: var(--magenta-light);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        details summary::-webkit-details-marker {
            display: none;
        }

        .spoiler-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 12px 0 8px;
            line-height: 1.4;
        }

        .code-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #e0e0e0;
            word-break: break-all;
            border: 1px solid rgba(255,255,255,0.08);
            display: block;
            margin-bottom: 10px;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            font-weight: 500;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            width: 100%;
            padding: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }

        .btn-copy:active {
            background: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="brand-title">⚡ OnyxProxy</div>
    <div class="brand-subtitle">Премиальный VPN с автонастройкой</div>

    <div class="glass" style="text-align: center;">
        <img class="illustration" src="https://placehold.co/400x250/2a1a3a/d81b60?text=🔐+Ваш+ключ+готов" alt="Импорт ключа">

        <button class="btn-primary" onclick="openHapp()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            Подключиться
        </button>
        <div class="status" id="status"></div>
    </div>

    <div class="stores-title">📱 Нет приложения? Скачайте:</div>
    <div class="store-grid">
        <a class="store-card" href="https://apps.apple.com/ru/app/happ-proxy-utility-plus/id6746188973" target="_blank" rel="noopener">
            <img src="https://img.icons8.com/color/96/mac-os.png" alt="iOS">
            <div class="store-label">iOS</div>
        </a>
        <a class="store-card" href="https://play.google.com/store/apps/details?id=com.happproxy" target="_blank" rel="noopener">
            <img src="https://img.icons8.com/color/96/android-os.png" alt="Android">
            <div class="store-label">Android</div>
        </a>
        <a class="store-card" href="https://github.com/Happ-proxy/happ-desktop/releases/latest/download/setup-Happ.x64.exe" target="_blank" rel="noopener">
            <img src="https://img.icons8.com/color/96/windows-10.png" alt="Windows">
            <div class="store-label">Windows</div>
        </a>
    </div>

    <div class="spoiler-glass">
        <details>
            <summary>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
                Ручная установка (ссылка)
            </summary>
            <div class="spoiler-text">Скопируйте и вставьте в Happ (Добавить профиль → Импорт):</div>
            <code class="code-box" id="link"></code>
            <button class="btn-copy" onclick="copyLink()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                Скопировать ссылку
            </button>
        </details>
    </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const link = params.get('link');
    document.getElementById('link').textContent = link || 'Ссылка не указана';

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function openHapp() {
        if (!link) {
            alert('Ошибка: ссылка не найдена');
            return;
        }
        try {
            tg.openLink(link, { try_instant_view: false });
            document.getElementById('status').innerText = '⏳ Открываем Happ…';
        } catch (e) {
            const newWindow = window.open(link, '_blank');
            if (!newWindow) {
                document.getElementById('status').innerText = 'Не удалось открыть автоматически. Воспользуйтесь ручной установкой ниже.';
            } else {
                document.getElementById('status').innerText = 'Приложение должно открыться в новом окне.';
            }
        }
    }

    function copyLink() {
        if (!link) return;
        navigator.clipboard.writeText(link).then(() => {
            alert('✅ Ссылка скопирована! Вставьте её в Happ (Добавить профиль → Импорт).');
        }).catch(() => {
            prompt('Скопируйте ссылку вручную:', link);
        });
    }

    window.addEventListener('load', function() {
        if (link) {
            setTimeout(() => {
                try { tg.openLink(link, { try_instant_view: false }); } catch (e) {}
            }, 500);
        }
    });
</script>
</body>
</html>
