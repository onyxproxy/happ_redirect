<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnyxProxy · Подключение</title>
    <style>
        :root {
            --onyx-magenta: #d81b60;
            --onyx-magenta-light: #fce4ec;
            --onyx-magenta-dark: #ad1457;
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #555;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text);
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--onyx-magenta);
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .card {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 24px 16px 20px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            text-align: center;
        }

        .illustration {
            width: 100%;
            max-width: 260px;
            height: auto;
            margin: 0 auto 18px;
            display: block;
            border-radius: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--onyx-magenta) 0%, var(--onyx-magenta-dark) 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(216,27,96,0.3);
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:active {
            opacity: 0.85;
        }

        .status {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stores-title {
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 12px;
            color: var(--text);
        }

        .store-grid {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .store-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 14px 6px;
            flex: 1;
            text-align: center;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.15s;
        }

        .store-card:active {
            transform: scale(0.96);
        }

        .store-card img {
            width: 38px;
            height: 38px;
        }

        .store-label {
            font-size: 13px;
            font-weight: 500;
        }

        .spoiler-card {
            background: var(--onyx-magenta-light);
            border-radius: 16px;
            padding: 14px;
            text-align: left;
        }

        details summary {
            color: var(--onyx-magenta);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        details summary::-webkit-details-marker {
            display: none;
        }

        .spoiler-text {
            font-size: 13px;
            margin: 12px 0 8px;
            line-height: 1.4;
        }

        .code-box {
            background: #fff;
            border-radius: 10px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            border: 1px solid #e0e0e0;
            display: block;
            margin-bottom: 10px;
        }

        .btn-copy {
            background: transparent;
            color: var(--text);
            font-weight: 500;
            font-size: 14px;
            border: none;
            width: 100%;
            padding: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            border-radius: 10px;
        }

        .btn-copy:active {
            background: rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="brand-title">⚡ OnyxProxy</div>
    <div class="brand-subtitle">Быстрый и безопасный VPN</div>

    <div class="card">
        <img class="illustration" src="https://placehold.co/400x250/fce4ec/d81b60?text=📱+Импорт+ключа" alt="Импорт ключа">

        <button class="btn-primary" onclick="openHapp()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            Подключиться
        </button>
        <div class="status" id="status"></div>
    </div>

    <div class="stores-title">📱 Нет приложения? Скачайте:</div>
    <div class="store-grid">
        <a class="store-card" href="https://apps.apple.com/ru/app/happ-proxy-utility-plus/id6746188973" target="_blank" rel="noopener">
            <img src="https://img.icons8.com/color/96/mac-os.png" alt="iOS">
            <div class="store-label">iOS</div>
        </a>
        <a class="store-card" href="https://play.google.com/store/apps/details?id=com.happproxy" target="_blank" rel="noopener">
            <img src="https://img.icons8.com/color/96/android-os.png" alt="Android">
            <div class="store-label">Android</div>
        </a>
        <a class="store-card" href="https://github.com/Happ-proxy/happ-desktop/releases/latest/download/setup-Happ.x64.exe" target="_blank" rel="noopener">
            <img src="https://img.icons8.com/color/96/windows-10.png" alt="Windows">
            <div class="store-label">Windows</div>
        </a>
    </div>

    <div class="spoiler-card">
        <details>
            <summary>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
                Ручная установка (ссылка)
            </summary>
            <div class="spoiler-text">Скопируйте и вставьте в Happ (Добавить профиль → Импорт):</div>
            <code class="code-box" id="link"></code>
            <button class="btn-copy" onclick="copyLink()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                Скопировать ссылку
            </button>
        </details>
    </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const link = params.get('link');
    document.getElementById('link').textContent = link || 'Ссылка не указана';

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function openHapp() {
        if (!link) {
            alert('Ошибка: ссылка не найдена');
            return;
        }
        try {
            tg.openLink(link, { try_instant_view: false });
            document.getElementById('status').innerText = '⏳ Открываем Happ…';
        } catch (e) {
            const newWindow = window.open(link, '_blank');
            if (!newWindow) {
                document.getElementById('status').innerText = 'Не удалось открыть автоматически. Воспользуйтесь ручной установкой ниже.';
            } else {
                document.getElementById('status').innerText = 'Приложение должно открыться в новом окне.';
            }
        }
    }

    function copyLink() {
        if (!link) return;
        navigator.clipboard.writeText(link).then(() => {
            alert('✅ Ссылка скопирована! Вставьте её в Happ (Добавить профиль → Импорт).');
        }).catch(() => {
            prompt('Скопируйте ссылку вручную:', link);
        });
    }

    window.addEventListener('load', function() {
        if (link) {
            setTimeout(() => {
                try { tg.openLink(link, { try_instant_view: false }); } catch (e) {}
            }, 500);
        }
    });
</script>
</body>
</html>
